name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore BluetoothBatteryMonitor.sln

    - name: Run Test Suite
      run: dotnet test BluetoothBatteryMonitor.sln -c Release --no-restore --verbosity normal

    - name: Publish Single-File Executable
      run: >
        dotnet publish src/BluetoothBatteryMonitor.App/BluetoothBatteryMonitor.App.csproj
        -c Release
        -r win-x64
        --self-contained false
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -o ./publish

    - name: Create Release Zip Archive
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./BluetoothBatteryMonitor-win-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./publish/BluetoothBatteryMonitor.App.exe
          ./BluetoothBatteryMonitor-win-x64.zip
        generate_release_notes: true
        draft: false
        prerelease: false
