name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore BluetoothBatteryMonitor.sln

    - name: Build Solution (Release)
      run: dotnet build BluetoothBatteryMonitor.sln -c Release --no-restore

    - name: Run Test Suite (253 Tests)
      run: dotnet test BluetoothBatteryMonitor.sln -c Release --no-build --verbosity normal
